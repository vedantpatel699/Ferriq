name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: public/data/crude-market-prices.json
          key: market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-v1-
      - name: Refresh public market observations
        run: python scripts/fetch-market-prices.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - run: npm ci
      - run: npm run build
        env:
          # Served at https://vedantpatel699.github.io/Ferriq/ — see the
          # matching comment in vite.config.ts.
          DEPLOY_BASE_PATH: /Ferriq/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
